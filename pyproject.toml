[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joshy"
version = "0.1.0"
description = "Joshy: a personal reservation sniper for Resy and SevenRooms"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "cryptography>=42",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
joshy = "joshy.cli:main"

[tool.setuptools]
packages = ["joshy", "joshy.providers"]

[tool.setuptools.package-data]
joshy = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
